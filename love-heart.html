<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>心之所向</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}

  body{
    background:
      radial-gradient(1100px 760px at 50% 40%, #2b0a1d 0%, #1a0614 34%, #0d040b 66%, #050205 100%);
    font-family:"Cormorant Garamond","Songti SC","STSong",Georgia,"Times New Roman",serif;
    color:#fbe6ee;
    cursor:default;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  #stage{position:fixed;inset:0;display:block;z-index:1;}

  .veil{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:
      radial-gradient(circle at 50% 46%, rgba(255,70,120,.07) 0%, rgba(255,70,120,0) 52%),
      radial-gradient(circle at 50% 46%, rgba(0,0,0,0) 38%, rgba(0,0,0,.42) 82%, rgba(0,0,0,.72) 100%);
  }

  .ui{
    position:fixed;inset:0;z-index:3;pointer-events:none;
    display:flex;flex-direction:column;justify-content:space-between;align-items:center;
    padding:clamp(28px,7vh,72px) 6vw clamp(26px,6vh,64px);
    text-align:center;
  }

  .eyebrow{
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:10px;letter-spacing:.62em;text-indent:.62em;
    color:rgba(255,213,163,.72);
    text-transform:uppercase;
    opacity:0;
    animation:rise 2.2s cubic-bezier(.16,.8,.3,1) .25s forwards;
  }

  h1{
    margin-top:clamp(10px,1.8vh,20px);
    font-size:clamp(24px,4vw,48px);
    font-weight:400;
    letter-spacing:.28em;text-indent:.28em;
    color:#fff2f7;
    text-shadow:
      0 0 22px rgba(255,96,140,.55),
      0 0 64px rgba(255,40,90,.32),
      0 0 120px rgba(255,0,70,.18);
    opacity:0;
    animation:rise 2.6s cubic-bezier(.16,.8,.3,1) .5s forwards;
  }

  footer{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.2vh,22px);}

  .line{
    font-size:clamp(12px,1.35vw,15px);
    line-height:2.1;
    letter-spacing:.18em;text-indent:.18em;
    color:rgba(255,206,224,.62);
    max-width:26em;
    opacity:0;
    animation:rise 2.6s cubic-bezier(.16,.8,.3,1) 1.1s forwards;
  }

  .hint{
    font-size:9.5px;
    letter-spacing:.42em;text-indent:.42em;
    color:rgba(255,190,214,.34);
    opacity:0;
    animation:hintFade 9s cubic-bezier(.16,.8,.3,1) 2.2s forwards;
  }

  @keyframes rise{
    from{opacity:0;transform:translateY(16px);filter:blur(6px);}
    to{opacity:1;transform:translateY(0);filter:blur(0);}
  }
  @keyframes hintFade{
    0%{opacity:0;}
    18%{opacity:1;}
    72%{opacity:1;}
    100%{opacity:.18;}
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div class="veil"></div>

<div class="ui">
  <header>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
  </header>
  <footer>
    <p class="line" id="line"></p>
    <p class="hint" id="hint"></p>
  </footer>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     文案配置区 —— 想改字，改这里就够了
     ============================================================ */
  var CONFIG = {
    eyebrow: 'FOR  YOU',
    title:   '心 之 所 向',
    line:    '在所有物是人非的景色里，我最喜欢你。',
    hint:    '移动鼠标 · 轻触屏幕'
  };

  document.getElementById('eyebrow').textContent = CONFIG.eyebrow;
  document.getElementById('title').textContent   = CONFIG.title;
  document.getElementById('line').textContent    = CONFIG.line;
  document.getElementById('hint').textContent    = CONFIG.hint;

  /* ============================================================
     基础
     ============================================================ */
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, DPR = 1, unit = 1, cy = 0;
  var FADE = 0.115;          // 拖尾衰减：越小尾巴越长
  var PUSH_R = 150;          // 鼠标斥力半径

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

  /* 玫瑰 / 胭脂 / 暖金 调色板（RGB） */
  var PALETTE = [
    [255, 45, 111],   // 0 深玫瑰
    [255, 77, 125],   // 1 玫红
    [255, 123, 165],  // 2 亮粉
    [255, 176, 198],  // 3 藕粉
    [255, 232, 240],  // 4 近白高光
    [255, 205, 140]   // 5 香槟金
  ];

  /* 预渲染发光粒子贴图（比每帧画圆快得多，也更柔） */
  var SPRITE = 64;
  var sprites = PALETTE.map(function (rgb) {
    var c = document.createElement('canvas');
    c.width = c.height = SPRITE;
    var g = c.getContext('2d');
    var r = rgb[0], gg = rgb[1], b = rgb[2];
    var grd = g.createRadialGradient(SPRITE / 2, SPRITE / 2, 0, SPRITE / 2, SPRITE / 2, SPRITE / 2);
    grd.addColorStop(0,    'rgba(' + r + ',' + gg + ',' + b + ',1)');
    grd.addColorStop(0.26, 'rgba(' + r + ',' + gg + ',' + b + ',0.58)');
    grd.addColorStop(0.55, 'rgba(' + r + ',' + gg + ',' + b + ',0.16)');
    grd.addColorStop(1,    'rgba(' + r + ',' + gg + ',' + b + ',0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, SPRITE, SPRITE);
    return c;
  });

  /* 心形参数方程（经典） */
  function heartPoint(t) {
    var s = Math.sin(t);
    return [
      16 * s * s * s,
      13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
    ];
  }

  /* 用曲线离散成多边形，用于内部均匀取点（避免径向填充的"中轴亮线"） */
  var POLY = (function () {
    var pts = [];
    for (var i = 0; i < 480; i++) pts.push(heartPoint(i / 480 * Math.PI * 2));
    return pts;
  })();

  function insideHeart(x, y) {
    var inside = false;
    for (var i = 0, j = POLY.length - 1; i < POLY.length; j = i++) {
      var xi = POLY[i][0], yi = POLY[i][1], xj = POLY[j][0], yj = POLY[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }

  /* 心形轮廓路径 + 内核辉光（在"心形单位坐标系"里定义，随缩放/旋转复用） */
  var HEART_PATH = (function () {
    var p = new Path2D();
    p.moveTo(POLY[0][0], POLY[0][1]);
    for (var i = 1; i < POLY.length; i++) p.lineTo(POLY[i][0], POLY[i][1]);
    p.closePath();
    return p;
  })();

  var CORE_GRAD = null;
  function ensureCoreGrad() {
    if (CORE_GRAD) return;
    var g = ctx.createRadialGradient(0, -1, 0, 0, -1, 17);
    g.addColorStop(0,    'rgba(255,124,160,0.028)');
    g.addColorStop(0.45, 'rgba(255,58,106,0.016)');
    g.addColorStop(0.78, 'rgba(255,24,84,0.005)');
    g.addColorStop(1,    'rgba(255,0,60,0)');
    CORE_GRAD = g;
  }

  /* ============================================================
     场景数据
     ============================================================ */
  var particles = [];   // 构成爱心的粒子
  var rimEnd = 0;       // 前 rimEnd 个是描边粒子
  var dust = [];        // 环境浮尘
  var fx = [];          // 拖尾星尘 / 迸发粒子
  var mouse = { x: -9999, y: -9999, active: false };

  function colorIndexFor(r, edge) {
    var x = Math.random();
    if (x < 0.028) return 5;                        // 零星香槟金
    if (edge)     return x < 0.42 ? 4 : (x < 0.78 ? 3 : 2);   // 边缘最亮
    if (r < 0.3)  return x < 0.35 ? 4 : (x < 0.75 ? 3 : 2);   // 内核高光
    if (r < 0.65) return x < 0.3 ? 3 : (x < 0.75 ? 2 : 1);
    return x < 0.45 ? 2 : 1;
  }

  function buildHeart() {
    particles.length = 0;
    var count = Math.round(clamp(W * H / 430, 1500, 3800));
    var rimCount = Math.round(count * 0.40);

    /* 1) 描边粒子：贴着轮廓，让心形清晰、有锋利的边缘光 */
    for (var i = 0; i < rimCount; i++) {
      var t = (i + Math.random() * 1.5) / rimCount * Math.PI * 2;
      var hp = heartPoint(t);
      var k = rand(0.965, 1.01);

      /* 心尖 / 心口是曲线的两个尖点，粒子会扎堆成一根亮刺：
         尖点直接跳过，窄缝区域压暗，让它读成"折痕"而不是"火柴棍" */
      var ax = Math.abs(hp[0]);
      if (ax < 0.1) continue;
      var dim = ax < 1.0 ? 0.3 : 1;

      particles.push({
        nx: hp[0] * k,
        ny: hp[1] * k,
        col: colorIndexFor(1, true),
        size: rand(1.1, 2.3),
        a: rand(0.78, 1.0) * dim,
        ph: rand(0, Math.PI * 2),
        sp: rand(0.35, 1.1),
        amp: rand(0.25, 0.9),
        tw: rand(1.1, 3.0),
        x: 0, y: 0, init: false
      });
    }

    /* 2) 内部粒子：拒绝采样，均匀铺满，才不会出现放射状中轴 */
    rimEnd = particles.length;
    var fillCount = count - rimCount;
    var guard = fillCount * 40;
    var made = 0;
    while (made < fillCount && guard-- > 0) {
      var x = rand(-16, 16);
      var y = rand(-17.5, 12.5);
      if (!insideHeart(x, y)) continue;

      var depth = Math.sqrt(x * x + y * y) / 17;

      particles.push({
        nx: x,
        ny: y,
        col: colorIndexFor(depth, false),
        size: rand(0.7, 1.8),
        a: rand(0.42, 0.92) * (1.05 - depth * 0.22),
        ph: rand(0, Math.PI * 2),
        sp: rand(0.35, 1.2),
        amp: rand(0.3, 1.5),
        tw: rand(1.1, 3.2),
        x: 0, y: 0, init: false
      });
      made++;
    }
  }

  function buildDust() {
    dust.length = 0;
    var n = Math.round(clamp(W * H / 24000, 34, 120));
    for (var i = 0; i < n; i++) {
      dust.push({
        x: rand(0, W), y: rand(0, H),
        vx: rand(-7, 7), vy: rand(-16, -4),
        size: rand(0.6, 2.1),
        a: rand(0.05, 0.24),
        ph: rand(0, 6.283), sp: rand(0.2, 0.8),
        col: Math.random() < 0.25 ? 5 : 4
      });
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var wf = W < 640 ? 0.66 : 0.78;
    unit = Math.min(W * wf / 32, H * 0.57 / 29);
    cy = H * 0.5 - unit * 1.2;

    buildHeart();
    buildDust();
  }

  /* ============================================================
     心跳曲线：一次"咚—哒"双搏动 + 缓慢呼吸
     ============================================================ */
  function beatCurve(t) {
    var p = (t % 1.42) / 1.42;
    var g1 = Math.exp(-Math.pow((p - 0.055) / 0.052, 2));
    var g2 = Math.exp(-Math.pow((p - 0.285) / 0.075, 2));
    return 1 + 0.072 * g1 + 0.048 * g2 + 0.014 * Math.sin(t * 0.9);
  }

  /* ============================================================
     主循环
     ============================================================ */
  var last = 0;

  function frame(now) {
    requestAnimationFrame(frame);

    if (!last) last = now;
    var dt = Math.min(48, now - last) / 1000;
    last = now;
    var t = now / 1000;

    /* 拖尾：用 destination-out 擦除，保留背景渐变 */
    ctx.globalCompositeOperation = 'destination-out';
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0,0,0,' + FADE + ')';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    var beat = beatCurve(t);
    var u = unit * beat;
    var ox = W / 2;
    var oy = cy + Math.sin(t * 0.55) * H * 0.006;
    var rot = Math.sin(t * 0.4) * 0.013;
    var cs = Math.cos(rot), sn = Math.sin(rot);

    /* --- 心后辉光（跟着心跳一起呼吸） --- */
    var R = u * 15 * (0.96 + 0.08 * beat);
    var pulse = clamp(0.72 + (beat - 1) / 0.13 * 0.5, 0, 1);
    var g = ctx.createRadialGradient(ox, oy, 0, ox, oy, R);
    g.addColorStop(0,    'rgba(255,72,122,0.062)');
    g.addColorStop(0.42, 'rgba(255,40,104,0.026)');
    g.addColorStop(1,    'rgba(255,0,64,0)');
    ctx.globalAlpha = pulse;
    ctx.fillStyle = g;
    ctx.fillRect(ox - R, oy - R, R * 2, R * 2);
    ctx.globalAlpha = 1;

    /* --- 心体：轮廓内的柔和内核光，让粒子从"散点"变成"发光的实体" --- */
    ensureCoreGrad();
    ctx.save();
    ctx.translate(ox, oy);
    ctx.rotate(rot);
    ctx.scale(u, u);
    ctx.fillStyle = CORE_GRAD;
    ctx.fill(HEART_PATH);
    ctx.restore();

    /* --- 浮尘 --- */
    for (var d = 0; d < dust.length; d++) {
      var du = dust[d];
      du.x += du.vx * dt;
      du.y += du.vy * dt;
      if (du.y < -30) { du.y = H + 26; du.x = rand(0, W); }
      if (du.x < -30) du.x = W + 26;
      if (du.x > W + 30) du.x = -26;
      var dtw = 0.45 + 0.55 * Math.sin(t * du.sp + du.ph);
      ctx.globalAlpha = du.a * dtw;
      var dd = du.size * 5;
      ctx.drawImage(sprites[du.col], du.x - dd / 2, du.y - dd / 2, dd, dd);
    }

    /* --- 爱心粒子 --- */
    var R2 = PUSH_R * PUSH_R;

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];

      var bx = p.nx * u;
      var by = -p.ny * u;
      var tx = ox + (bx * cs - by * sn);
      var ty = oy + (bx * sn + by * cs);

      /* 呼吸般的抖动，让轮廓活起来 */
      tx += Math.sin(t * p.sp + p.ph) * p.amp;
      ty += Math.cos(t * p.sp * 0.9 + p.ph * 1.3) * p.amp;

      /* 鼠标斥力 */
      if (mouse.active) {
        var dx = p.x - mouse.x;
        var dy = p.y - mouse.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < R2) {
          var dist = Math.sqrt(d2) || 0.001;
          var f = 1 - dist / PUSH_R;
          var push = f * f * 42;
          tx += dx / dist * push;
          ty += dy / dist * push;
        }
      }

      if (!p.init) { p.x = tx; p.y = ty; p.init = true; }
      p.x += (tx - p.x) * 0.17;
      p.y += (ty - p.y) * 0.17;

      var tw = 0.7 + 0.3 * Math.sin(t * p.tw + p.ph);
      ctx.globalAlpha = clamp(p.a * tw * (0.92 + 0.16 * (beat - 1) * 4), 0, 1);

      var ds = p.size * 3.4;
      ctx.drawImage(sprites[p.col], p.x - ds / 2, p.y - ds / 2, ds, ds);
    }

    /* --- 边缘飘出的余烬 --- */
    if (Math.random() < 0.5 && fx.length < 460 && rimEnd > 0) {
      var src = particles[(Math.random() * rimEnd) | 0];
      if (src && src.init) {
        fx.push({
          x: src.x, y: src.y,
          vx: rand(-10, 10), vy: rand(-28, -12),
          life: 0, max: rand(1.8, 3.6),
          col: Math.random() < 0.22 ? 5 : (Math.random() < 0.5 ? 2 : 3),
          size: rand(0.7, 1.9)
        });
      }
    }

    /* --- 星尘 / 迸发粒子 --- */
    for (var k = fx.length - 1; k >= 0; k--) {
      var f2 = fx[k];
      f2.life += dt;
      if (f2.life > f2.max) { fx.splice(k, 1); continue; }
      f2.x += f2.vx * dt;
      f2.y += f2.vy * dt;
      f2.vx *= (1 - 0.9 * dt);
      f2.vy *= (1 - 0.9 * dt);

      var lerp = 1 - f2.life / f2.max;
      ctx.globalAlpha = lerp * lerp * 0.9;
      var fs = f2.size * 4.4;
      ctx.drawImage(sprites[f2.col], f2.x - fs / 2, f2.y - fs / 2, fs, fs);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ============================================================
     交互
     ============================================================ */
  function spawnTrail(x, y, dx, dy) {
    var dist = Math.sqrt(dx * dx + dy * dy);
    var n = clamp(Math.round(dist / 8) + 1, 1, 7);
    if (fx.length > 700) n = Math.min(n, 2);

    for (var i = 0; i < n; i++) {
      var k = i / n;
      fx.push({
        x: x - dx * (1 - k) + rand(-3.2, 3.2),
        y: y - dy * (1 - k) + rand(-3.2, 3.2),
        vx: rand(-16, 16),
        vy: rand(-12, 20),
        life: 0, max: rand(0.55, 1.25),
        col: Math.random() < 0.3 ? 5 : (Math.random() < 0.5 ? 3 : (Math.random() < 0.6 ? 2 : 1)),
        size: rand(0.65, 1.75)
      });
    }
  }

  function moveTo(x, y) {
    if (!mouse.active) {
      mouse.x = x; mouse.y = y; mouse.active = true;
      return;
    }
    spawnTrail(x, y, x - mouse.x, y - mouse.y);
    mouse.x = x;
    mouse.y = y;
  }

  window.addEventListener('mousemove', function (e) { moveTo(e.clientX, e.clientY); }, { passive: true });

  window.addEventListener('touchmove', function (e) {
    var tp = e.touches[0];
    if (tp) moveTo(tp.clientX, tp.clientY);
  }, { passive: true });

  window.addEventListener('mouseleave', function () {
    mouse.active = false; mouse.x = -9999; mouse.y = -9999;
  });

  function burst(x, y) {
    var n = 78;
    for (var i = 0; i < n; i++) {
      var a = rand(0, Math.PI * 2);
      var sp = Math.pow(Math.random(), 0.55) * 300 + 40;
      fx.push({
        x: x + Math.cos(a) * rand(0, 9),
        y: y + Math.sin(a) * rand(0, 9),
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0, max: rand(0.75, 1.85),
        col: Math.random() < 0.28 ? 5 : (Math.random() < 0.45 ? 4 : pick([1, 2, 3])),
        size: rand(0.8, 2.3)
      });
    }
  }

  window.addEventListener('mousedown', function (e) { burst(e.clientX, e.clientY); });
  window.addEventListener('touchstart', function (e) {
    var tp = e.touches[0];
    if (tp) {
      mouse.x = tp.clientX; mouse.y = tp.clientY; mouse.active = true;
      burst(tp.clientX, tp.clientY);
    }
  }, { passive: true });

  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(resize, 160);
  });

  document.addEventListener('visibilitychange', function () { last = 0; });

  /* 启动 */
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
